<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zimbra - Inicio de Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      padding: 3rem;
      width: 100%;
      max-width: 420px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-header h2 {
      color: #1e3a8a;
      font-weight: 700;
      margin: 0;
    }
    .login-header p {
      color: #64748b;
      margin: 0.5rem 0 0;
    }
    .form-label {
      font-weight: 600;
      color: #374151;
      font-size: 0.9rem;
    }
    .form-control {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    .btn-login {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 0.875rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      width: 100%;
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: #1e40af;
      transform: translateY(-1px);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      margin: 1.5rem 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider:not(:empty)::before { margin-right: 0.5rem; }
    .divider:not(:empty)::after { margin-left: 0.5rem; }
    .footer-text {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }
    .footer-text a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h2><i class="bi bi-shop me-2"></i>Zimbra</h2>
      <p>Sistema de Gestión Comercial</p>
    </div>

    <div class="alert alert-danger d-none" id="alertaLogin">
      <i class="bi bi-exclamation-circle me-2"></i>
      <span id="mensajeError"></span>
    </div>

    <form id="formLogin">
      <div class="mb-3">
        <label class="form-label" for="correo">Correo Electrónico</label>
        <input type="email" class="form-control" id="correo" placeholder="correo@empresa.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="contrasena">Contraseña</label>
        <input type="password" class="form-control" id="contrasena" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
      </button>
    </form>

    <div class="footer-text">
      Sistema Zimbra v1.0 &mdash; Universidad - Sistemas Transaccionales
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_BASE = 'http://localhost:3000/api';

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();

      const correo = document.getElementById('correo').value;
      const contrasena = document.getElementById('contrasena').value;

      const btn = e.target.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;
      btn.innerHTML = '<i class="bi bi-arrow-repeat spin me-2"></i>Autenticando...';
      btn.disabled = true;

      try {
        const respuesta = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, contrasena })
        });

        const datos = await respuesta.json();

        if (respuesta.ok && datos.success) {
          // Guardar datos del usuario en sessionStorage
          sessionStorage.setItem('zimbra_usuario', JSON.stringify(datos.usuario));
          // Redirigir al dashboard
          window.location.href = 'index.html';
        } else {
          const alerta = document.getElementById('alertaLogin');
          const mensaje = document.getElementById('mensajeError');
          mensaje.textContent = datos.error || 'Error al iniciar sesión';
          alerta.classList.remove('d-none');
        }
      } catch (error) {
        console.error('Error de conexión:', error);
        const alerta = document.getElementById('alertaLogin');
        const mensaje = document.getElementById('mensajeError');
        mensaje.textContent = 'Error de conexión con el servidor';
        alerta.classList.remove('d-none');
      } finally {
        btn.innerHTML = textoOriginal;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
